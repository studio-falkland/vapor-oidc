name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    name: Build & Test (macOS)
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Test with coverage
        run: swift test --configuration debug --enable-code-coverage 2>&1

      - name: Coverage report
        run: |
          xcrun llvm-cov report \
            -instr-profile .build/debug/codecov/default.profdata \
            -object .build/debug/VaporOIDCCoreTests.xctest/Contents/MacOS/VaporOIDCCoreTests \
            -object .build/debug/VaporOIDCTests.xctest/Contents/MacOS/VaporOIDCTests \
            -ignore-filename-regex '(^|/)(Tests|\.build)/' \
            | tee coverage.txt

          {
            echo "## Coverage"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  build-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: swift build --configuration debug 2>&1

      - name: Test
        run: swift test --configuration debug 2>&1
